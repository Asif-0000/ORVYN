<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ORVYN - Premium Tech & Gadgets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #F8F9FA;
      --card-bg: #FFFFFF;
      --primary: #7C3AED;      /* Royal Violet */
      --primary-hover: #6D28D9;
      --primary-light: #F5F3FF;
      --text: #1E1B4B;
      --muted: #64748B;
      --border: #E2E8F0;
      --price-color: #E11D48;  /* Highlight Red Price */
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 90px; -webkit-font-smoothing: antialiased; }
    
    /* Top Bar */
    .top-bar {
      background: var(--primary);
      color: #fff;
      font-size: 0.85rem;
      padding: 7px 12px;
      text-align: center;
      font-weight: 500;
    }

    /* Navbar */
    nav {
      max-width: 1140px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
    }
    .brand-text h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--text);
      line-height: 1;
    }
    .brand-text span {
      font-size: 0.72rem;
      letter-spacing: 1px;
      color: var(--primary);
      font-weight: 700;
      text-transform: uppercase;
    }
    .wa-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .wa-btn:hover { border-color: #22C55E; color: #15803D; }
    .wa-dot { width: 8px; height: 8px; background: #22C55E; border-radius: 50%; display: inline-block; }

    /* Category Navigation & Search Bar */
    .controls-wrapper {
      max-width: 1100px;
      margin: 20px auto 25px;
      padding: 0 16px;
    }
    .category-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 12px;
      scrollbar-width: none;
    }
    .category-scroll::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: #FFFFFF;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .cat-btn.active, .cat-btn:hover {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      flex-wrap: wrap;
      gap: 14px;
    }
    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
    }
    .search-input-wrap {
      position: relative;
      min-width: 250px;
    }
    .search-input {
      width: 100%;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px 8px 36px;
      font-size: 0.9rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--primary); }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.9rem;
    }

    /* Product Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Clean Card Design */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
    }

    /* Single Clean Image Box */
    .img-box {
      width: 100%;
      height: 240px;
      background: #FAFAFA;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .img-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* Card Details */
    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }
    .product-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
      line-height: 1.35;
    }

    /* Key Features / Bullet points */
    .spec-list {
      list-style-type: disc;
      padding-left: 18px;
      margin-bottom: 16px;
      color: #475569;
      font-size: 0.85rem;
      line-height: 1.6;
    }
    .spec-list li {
      margin-bottom: 4px;
    }

    .divider {
      border: 0;
      height: 1px;
      background: var(--border);
      margin: 10px 0 14px;
    }

    /* Price Section */
    .price-center {
      text-align: center;
      margin-bottom: 12px;
    }
    .offer-price {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--price-color);
    }
    .regular-price {
      font-size: 0.9rem;
      text-decoration: line-through;
      color: var(--muted);
      margin-left: 6px;
      font-weight: 500;
    }

    /* Single Buy Now Button */
    .btn-buy-now {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #F1F5F9;
      color: #2563EB;
      border: 1px solid #DBEAFE;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-buy-now:hover {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }
  </style>
</head>
<body>

  <!-- Top Announcement Bar -->
  <div class="top-bar">
    ⚡ সারা বাংলাদেশে ফ্রি হোম ডেলিভারি ও ক্যাশ অন ডেলিভারি সুবিধা!
  </div>

  <!-- Header Navigation -->
  <nav>
    <a href="#" class="brand-wrap">
      <img src="Profile pic.jpg" class="brand-logo" alt="ORVYN Logo" onerror="this.src='https://via.placeholder.com/150/7C3AED/ffffff?text=O'" />
      <div class="brand-text">
        <h1>ORVYN</h1>
        <span>PREMIUM TECH</span>
      </div>
    </a>
    
    <a href="https://wa.me/8801805529344" target="_blank" class="wa-btn">
      <span class="wa-dot"></span>
      <span>01805-529344</span>
    </a>
  </nav>

  <!-- Controls: Category Filters & Search -->
  <div class="controls-wrapper">
    <div class="category-scroll" id="category-tabs"></div>

    <div class="section-header">
      <div class="section-title">পণ্য তালিকা</div>
      <div class="search-input-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" class="search-input" placeholder="প্রোডাক্ট খুঁজুন..." oninput="handleSearch()" />
      </div>
    </div>
  </div>

  <!-- Product Grid -->
  <div id="product-grid" class="grid"></div>

  <script>
    /* =====================================================================
       এখানে শুধু প্রোডাক্টের তথ্য ও স্পেসিফিকেশন অ্যাড করবেন
       ===================================================================== */
    const PRODUCTS = [
      {
        id: "P-101",
        name: "Baseus 20000mAh 22.5W Fast Charging Power Bank",
        category: "Powerbank",
        offerPrice: 2450,
        regularPrice: 2700,
        link: "products/Powerbank22.5.html", // আপনার তৈরি করা প্রোডাক্ট ল্যান্ডিং পেজের লিঙ্ক
        image: "https://resellkori.com/wp-content/uploads/2026/07/product-3-8-768x768.webp",
        specs: [
          "Capacity: 20000mAh / 3.7V (74Wh)",
          "Input: Type-C & Micro USB 18W",
          "Output: 22.5W Super Fast Charging",
          "Digital Battery Percentage Display"
        ]
      },
      {
        id: "P-102",
        name: "Jiayou Thunder 6 20000mAh Power Bank",
        category: "Powerbank",
        offerPrice: 1190,
        regularPrice: 1500,
        link: "products/Powerbank22.5.html",
        image: "https://via.placeholder.com/400x400?text=Jiayou+Powerbank",
        specs: [
          "Type-C/Micro Input: DC 5V (5V/2.5A)",
          "USB Output1/2: DC 5V-2.5A / 5V-2.4A",
          "Dual USB Output Support",
          "Battery Capacity: 20000mAh (74Wh)"
        ]
      }
    ];

    let currentCategory = "all";

    function initStore() {
      setupCategoryTabs();
      renderProducts();
    }

    function setupCategoryTabs() {
      const tabsContainer = document.getElementById("category-tabs");
      const categories = [...new Set(PRODUCTS.map(p => p.category))];

      let html = `
        <button class="cat-btn ${currentCategory === 'all' ? 'active' : ''}" onclick="filterByCategory('all')">
          সকল পণ্য
        </button>
      `;

      categories.forEach(cat => {
        html += `
          <button class="cat-btn ${currentCategory === cat ? 'active' : ''}" onclick="filterByCategory('${cat}')">
            ${cat}
          </button>
        `;
      });

      tabsContainer.innerHTML = html;
    }

    function filterByCategory(category) {
      currentCategory = category;
      setupCategoryTabs();
      renderProducts();
    }

    function handleSearch() {
      renderProducts();
    }

    function renderProducts() {
      const container = document.getElementById("product-grid");
      const searchTerm = document.getElementById("search-input").value.toLowerCase().trim();

      const filtered = PRODUCTS.filter(p => {
        const matchesCategory = (currentCategory === "all") || (p.category === currentCategory);
        const matchesSearch = p.name.toLowerCase().includes(searchTerm);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #64748B; padding: 40px;'>কোনো প্রোডাক্ট পাওয়া যায়নি।</p>";
        return;
      }

      container.innerHTML = "";

      filtered.forEach(p => {
        const specsHtml = p.specs && p.specs.length > 0 
          ? `<ul class="spec-list">${p.specs.map(s => `<li>${s}</li>`).join("")}</ul>` 
          : "";

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="img-box">
            <img src="${p.image}" alt="${p.name}" />
          </div>

          <div class="card-body">
            <div>
              <h3 class="product-title">${p.name}</h3>
              ${specsHtml}
            </div>

            <div>
              <hr class="divider" />
              <div class="price-center">
                <span class="offer-price">${p.offerPrice}৳</span>
                ${p.regularPrice > p.offerPrice ? `<span class="regular-price">${p.regularPrice}৳</span>` : ""}
              </div>

              <!-- সিঙ্গেল বাটন: সরাসরি ল্যান্ডিং পেজে নিয়ে যাবে -->
              <a href="${p.link}" class="btn-buy-now">
                🛒 Buy Now
              </a>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    initStore();
  </script>
</body>
</html>
